<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Магазин</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-secondary-bg-color, #f2f2f5);
    --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #ffffff));
    --text: var(--tg-theme-text-color, #141416);
    --hint: var(--tg-theme-hint-color, #8b8f99);
    --line: color-mix(in srgb, var(--hint) 22%, transparent);
    --accent: #ff5a36;
    --accent-soft: color-mix(in srgb, var(--accent) 14%, transparent);
    --accent-text: #ffffff;
    --danger: var(--tg-theme-destructive-text-color, #e5484d);
    --ok: #22a45d;
    --radius: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: var(--tg-theme-secondary-bg-color, #0f0f12);
      --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #1c1c21));
      --text: var(--tg-theme-text-color, #f2f2f5);
      --hint: var(--tg-theme-hint-color, #8b8f99);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  body { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
  input, textarea { font: inherit; color: var(--text); }
  [hidden] { display: none !important; }

  /* Шапка */
  .top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 14px 16px 8px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .logo { width: 38px; height: 38px; border-radius: 12px; background: var(--accent); display: grid; place-items: center; font-size: 20px; flex: none; }
  .brand h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
  .brand small { display: block; color: var(--hint); font-size: 12.5px; margin-top: 2px; }
  .back { display: flex; align-items: center; gap: 6px; color: var(--accent); font-weight: 600; margin-bottom: 8px; }
  .search { display: flex; align-items: center; gap: 8px; background: var(--card); border-radius: 14px; padding: 0 12px; height: 42px; }
  .search svg { flex: none; opacity: .5; }
  .search input { flex: 1; border: 0; outline: 0; background: none; height: 100%; min-width: 0; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px 4px; margin: 0 -16px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 8px 14px; border-radius: 999px; background: var(--card); font-weight: 600; font-size: 14px; white-space: nowrap; }
  .chip.on { background: var(--text); color: var(--bg); }

  .banner { margin: 4px 16px 10px; padding: 10px 14px; border-radius: 14px; background: var(--accent-soft); font-size: 13.5px; }

  /* Каталог */
  .section-title { margin: 16px 16px 10px; font-size: 18px; font-weight: 800; letter-spacing: -0.01em; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 0 16px; }
  @media (min-width: 560px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .card { background: var(--card); border-radius: var(--radius); padding: 8px; display: flex; flex-direction: column; min-width: 0; }
  .pic { position: relative; aspect-ratio: 1 / 1; border-radius: 13px; overflow: hidden; display: grid; place-items: center;
    background: color-mix(in srgb, var(--hint) 10%, transparent); font-size: 56px; line-height: 1; }
  .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pic.noimg::after { content: "🛍️"; }
  .soldout .pic { filter: grayscale(1); opacity: .5; }
  .badge { position: absolute; left: 8px; top: 8px; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--card); color: var(--hint); }
  .badge.adult { background: #2b2d42; color: #fff; font-size: 12px; }
  .left { color: var(--accent); font-size: 12px; font-weight: 700; margin-top: 2px; }
  .age { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border-radius: 14px; border: 1.5px solid var(--line); cursor: pointer; }
  .age.on { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 10%, transparent); }
  .age.bad { border-color: var(--danger); }
  .age .box { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--line); flex: none; display: grid; place-items: center; color: #fff; font-size: 14px; font-weight: 800; }
  .age.on .box { background: var(--ok); border-color: var(--ok); }
  .age small { color: var(--hint); display: block; margin-top: 2px; }
  .stepper button:disabled { opacity: .4; }
  .info { padding: 8px 4px 0; flex: 1; }
  .name { font-weight: 650; font-size: 14.5px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .desc { color: var(--hint); font-size: 12.5px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 8px 4px 2px; min-height: 44px; }
  .price { font-weight: 800; font-size: 16px; white-space: nowrap; }
  .add { width: 36px; height: 36px; border-radius: 12px; background: var(--accent); color: var(--accent-text); font-size: 22px; font-weight: 600; display: grid; place-items: center; }
  .stepper { display: flex; align-items: center; background: var(--accent); color: var(--accent-text); border-radius: 12px; height: 36px; }
  .stepper button { width: 32px; height: 36px; font-size: 20px; font-weight: 600; color: var(--accent-text); }
  .stepper span { min-width: 18px; text-align: center; font-weight: 700; }
  .full .stepper { flex: none; }
  .na { color: var(--hint); font-size: 12.5px; font-weight: 600; }
  .empty { text-align: center; color: var(--hint); padding: 48px 24px; }
  .empty b { display: block; font-size: 40px; margin-bottom: 8px; }

  .skeleton { background: linear-gradient(90deg, var(--card) 25%, color-mix(in srgb, var(--hint) 12%, var(--card)) 50%, var(--card) 75%);
    background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: var(--radius); aspect-ratio: 3 / 4.3; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* Корзина */
  .panel { background: var(--card); border-radius: var(--radius); margin: 0 16px 12px; padding: 14px; }
  .panel h2 { margin: 0 0 10px; font-size: 16px; font-weight: 800; }
  .row { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
  .row + .row { border-top: 1px solid var(--line); }
  .thumb { width: 52px; height: 52px; flex: none; border-radius: 12px; overflow: hidden; display: grid; place-items: center; font-size: 28px;
    background: color-mix(in srgb, var(--hint) 10%, transparent); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .row .grow { flex: 1; min-width: 0; }
  .row .name { -webkit-line-clamp: 1; }
  .row .sub { color: var(--hint); font-size: 13px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; background: color-mix(in srgb, var(--hint) 12%, transparent); border-radius: 12px; padding: 3px; margin-bottom: 12px; }
  .seg button { padding: 9px; border-radius: 10px; font-weight: 650; font-size: 14px; }
  .seg button.on { background: var(--card); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  .point { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border-radius: 14px; border: 1.5px solid var(--line); margin-bottom: 8px; text-align: left; width: 100%; }
  .point.on { border-color: var(--accent); background: var(--accent-soft); }
  .point .dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); flex: none; margin-top: 1px; display: grid; place-items: center; }
  .point.on .dot { border-color: var(--accent); }
  .point.on .dot::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  .point b { display: block; }
  .point small { color: var(--hint); }
  .note { color: var(--hint); font-size: 13px; margin: 2px 0 0; }
  label.field { display: block; margin-bottom: 10px; }
  label.field span { display: block; font-size: 12.5px; color: var(--hint); margin: 0 0 4px 2px; }
  label.field input, label.field textarea { width: 100%; border: 1.5px solid var(--line); background: transparent; border-radius: 12px; padding: 11px 12px; outline: 0; resize: none; }
  label.field input:focus, label.field textarea:focus { border-color: var(--accent); }
  label.field.bad input { border-color: var(--danger); }
  .sum { display: flex; justify-content: space-between; padding: 4px 0; color: var(--hint); }
  .sum.total { color: var(--text); font-weight: 800; font-size: 18px; padding-top: 10px; margin-top: 6px; border-top: 1px solid var(--line); }
  .warn { color: var(--danger); font-size: 13.5px; margin-top: 8px; }

  /* Готово */
  .done { text-align: center; padding: 28px 16px 8px; }
  .done .tick { width: 76px; height: 76px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; font-size: 40px; margin: 0 auto 14px; animation: pop .4s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } }
  .done h2 { margin: 0 0 6px; font-size: 24px; font-weight: 800; }
  .done p { margin: 0; color: var(--hint); }
  .pay-amount { font-size: 30px; font-weight: 800; margin: 2px 0 10px; }
  .req { display: flex; align-items: center; gap: 10px; background: color-mix(in srgb, var(--hint) 10%, transparent); border-radius: 14px; padding: 12px 12px 12px 14px; }
  .req code { flex: 1; font: 700 18px/1.3 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .02em; overflow-wrap: break-word; }
  .copy { background: var(--accent); color: var(--accent-text); border-radius: 10px; padding: 8px 12px; font-weight: 700; font-size: 13.5px; flex: none; }
  .steps { margin: 12px 0 0; padding-left: 20px; }
  .steps li { margin: 6px 0; }

  /* Нижняя кнопка */
  .bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 70%, transparent); }
  .main-btn { width: 100%; height: 54px; border-radius: 16px; background: var(--accent); color: var(--accent-text); font-weight: 750; font-size: 16px;
    display: flex; align-items: center; justify-content: space-between; padding: 0 18px; box-shadow: 0 6px 20px color-mix(in srgb, var(--accent) 35%, transparent); }
  .main-btn.center { justify-content: center; }
  .main-btn:disabled { opacity: .45; box-shadow: none; }
  .main-btn .count { background: rgba(255,255,255,.22); border-radius: 999px; padding: 2px 9px; font-size: 14px; margin-right: 8px; }
  .spin { width: 20px; height: 20px; border: 2.5px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: r .8s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }

  /* Баланс */
  .brand .grow { flex: 1; min-width: 0; }
  .wallet-chip { flex: none; display: flex; align-items: center; gap: 6px; background: var(--card); padding: 8px 12px; border-radius: 999px; font-weight: 750; font-size: 14px; white-space: nowrap; }
  .bal-card { margin: 8px 16px 12px; padding: 18px; border-radius: 22px; color: #fff; background: linear-gradient(135deg, #ff8a50, #ff4d2e); box-shadow: 0 8px 24px color-mix(in srgb, var(--accent) 30%, transparent); }
  .bal-card small { opacity: .9; font-weight: 600; }
  .bal-card .big { font-size: 36px; font-weight: 800; letter-spacing: -0.02em; margin: 2px 0 6px; }
  .amounts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 10px; }
  .amt { padding: 12px 0; border-radius: 12px; border: 1.5px solid var(--line); font-weight: 750; font-size: 15px; }
  .amt.on { border-color: var(--accent); background: var(--accent-soft); }
  .bonus-note { font-size: 13px; padding: 9px 12px; border-radius: 12px; background: color-mix(in srgb, var(--ok) 12%, transparent); margin-top: 8px; }
  .op-amt { font-weight: 750; white-space: nowrap; }
  .op-amt.plus { color: var(--ok); }
  .op-amt.dim { color: var(--hint); text-decoration: line-through; }
  .point.disabled { opacity: .55; }
  .link-btn { color: var(--accent); font-weight: 700; font-size: 13px; }

  /* Вкусы, остатки, пожелания */
  .vars { display: flex; gap: 5px; overflow-x: auto; margin-top: 6px; scrollbar-width: none; padding-right: 18px;
    -webkit-mask-image: linear-gradient(to right, #000 82%, transparent); mask-image: linear-gradient(to right, #000 82%, transparent); }
  .vars::-webkit-scrollbar { display: none; }
  .var { flex: none; padding: 4px 9px; border-radius: 999px; background: color-mix(in srgb, var(--hint) 14%, transparent); font-size: 12px; font-weight: 650; white-space: nowrap; }
  .var.on { background: var(--text); color: var(--bg); }
  .var.out { opacity: .5; text-decoration: line-through; }
  .vols { display: flex; gap: 4px; margin: 8px 4px 0; padding: 3px; border-radius: 11px; background: color-mix(in srgb, var(--hint) 13%, transparent); overflow-x: auto; scrollbar-width: none; }
  .vols::-webkit-scrollbar { display: none; }
  .vol { flex: 1 0 auto; padding: 6px 4px; border-radius: 9px; font-size: 11.5px; font-weight: 750; white-space: nowrap; color: var(--hint); }
  .vol.on { background: var(--card); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.14); }
  .vol.out { opacity: .55; }
  .stock { font-size: 12px; font-weight: 650; margin-top: 3px; color: var(--ok); }
  .stock.low { color: var(--accent); }
  .stock.no { color: var(--hint); }
  .notify { height: 36px; padding: 0 10px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 12.5px; white-space: nowrap; }
  .notify.done { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
  .info { margin: 2px 16px 10px; padding: 10px 14px; border-radius: 14px; background: var(--card); font-size: 13px; line-height: 1.45; }
  .suggest { margin: 18px 16px 6px; padding: 16px; border-radius: var(--radius); background: var(--card); text-align: center; }
  .suggest b { display: block; font-size: 16px; margin-bottom: 4px; }
  .suggest button { margin-top: 10px; padding: 10px 16px; border-radius: 12px; background: var(--accent); color: var(--accent-text); font-weight: 700; }
  .icon-btn { flex: none; width: 38px; height: 38px; border-radius: 999px; background: var(--card); display: grid; place-items: center; font-size: 17px; }
  .hint-free { font-size: 13px; padding: 9px 12px; border-radius: 12px; background: color-mix(in srgb, var(--ok) 12%, transparent); margin-top: 8px; }

  .toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); opacity: 0;
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; transition: .25s; pointer-events: none; z-index: 20; max-width: calc(100% - 32px); text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header class="top">
  <button class="back" id="backLink" hidden>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    В каталог
  </button>
  <div class="brand" id="brand">
    <div class="logo">🛒</div>
    <div class="grow"><h1 id="shopName">Магазин</h1><small id="shopSub">Напитки и снеки</small></div>
    <button class="wallet-chip" id="walletChip" hidden aria-label="Мой баланс">💰 <span id="walletSum">…</span></button>
    <button class="icon-btn" id="fbBtn" aria-label="Написать нам">💬</button>
  </div>
  <div id="catalogTools">
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Найти товар" autocomplete="off">
    </label>
    <nav class="chips" id="chips"></nav>
  </div>
</header>

<div id="banners"></div>

<main>
  <section id="catalogView"></section>
  <section id="cartView" hidden></section>
  <section id="doneView" hidden></section>
  <section id="walletView" hidden></section>
  <section id="topupView" hidden></section>
  <section id="feedbackView" hidden></section>
</main>

<div class="bottom" id="bottomBar" hidden><button class="main-btn" id="mainBtn"></button></div>
<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  const tg = window.Telegram && window.Telegram.WebApp;
  const inTelegram = !!(tg && tg.initData);
  const API = new URLSearchParams(location.search).get('api');
  const DEMO = !API;
  const PARAMS = new URLSearchParams(location.search);
  const START = PARAMS.get('screen');
  const CART_KEY = 'shop_cart_v1';

  const state = {
    shop: null, products: [], byId: {}, points: [],
    cart: loadCart(), view: 'catalog', cat: 'all', q: '',
    method: '', point: '', form: { name: '', address: '', phone: '', comment: '', room: '' }, adultOk: false,
    sending: false, result: null, error: '',
    balance: null, ops: [], pay: null, topupAmount: null, topupResult: null, returnTo: 'catalog', startDone: false,
    groups: [], sel: {}, notified: {}, fbKind: 'product', fbText: ''
  };

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = n => {
    const v = Math.round(Number(n) * 100) / 100;
    return v.toLocaleString('ru-RU', { maximumFractionDigits: 2 }) + ' ₽';
  };
  const plural = (n, one, few, many) => {
    const a = n % 10, b = n % 100;
    return a === 1 && b !== 11 ? one : a >= 2 && a <= 4 && (b < 12 || b > 14) ? few : many;
  };
  const haptic = (type) => { try { tg && tg.HapticFeedback && (type === 'ok' ? tg.HapticFeedback.notificationOccurred('success') : tg.HapticFeedback.impactOccurred('light')); } catch (e) {} };

  /* ---------- Запуск ---------- */
  if (tg) {
    try { tg.ready(); tg.expand(); } catch (e) {}
    try { if (tg.isVersionAtLeast && tg.isVersionAtLeast('7.7')) tg.disableVerticalSwipes(); } catch (e) {}
    try { tg.BackButton.onClick(goBack); } catch (e) {}
    const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
    if (u) state.form.name = [u.first_name, u.last_name].filter(Boolean).join(' ');
  }

  $('backLink').onclick = goBack;
  $('mainBtn').onclick = onMain;
  $('search').oninput = e => { state.q = e.target.value.trim().toLowerCase(); renderCatalog(); };
  $('chips').onclick = e => {
    const b = e.target.closest('[data-cat]');
    if (!b) return;
    state.cat = b.dataset.cat;
    renderChips(); renderCatalog();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
  $('catalogView').addEventListener('click', onQtyClick);
  $('cartView').addEventListener('click', onQtyClick);
  $('walletChip').onclick = () => { state.returnTo = state.view === 'cart' ? 'cart' : 'catalog'; go('wallet'); };
  $('fbBtn').onclick = () => openFeedback('wish');
  $('catalogView').addEventListener('click', e => {
    const vb = e.target.closest('[data-vol]');
    if (vb) { pickVolume(vb.dataset.group, vb.dataset.vol); haptic(); return; }
    const v = e.target.closest('[data-var]');
    if (v) { state.sel[v.dataset.group] = v.dataset.var; haptic(); refreshGroup(v.dataset.group); return; }
    const n = e.target.closest('[data-notify]');
    if (n) return notifyMe(n.dataset.notify);
    if (e.target.closest('[data-suggest]')) openFeedback('product');
  });

  showSkeleton();
  loadCatalog();

  /* ---------- Данные ---------- */
  async function loadCatalog() {
    try {
      const data = DEMO ? demoData() : await (await fetch(API + '?action=catalog', { cache: 'no-store' })).json();
      if (!data.ok) throw new Error(data.error || 'Ошибка');
      state.shop = data.shop;
      state.points = data.points || [];
      state.products = data.products || [];
      state.byId = {};
      state.products.forEach(p => { state.byId[p.id] = p; });
      buildGroups();
      Object.keys(state.cart).forEach(id => {
        const p = state.byId[id];
        if (!p || !p.available) delete state.cart[id];
        else if (p.stock != null && state.cart[id] > p.stock) state.cart[id] = p.stock;
      });
      saveCart();
      if (!state.points.some(p => p.name === state.point)) state.point = state.points[0] ? state.points[0].name : '';
      if (!state.points.length && state.shop.deliveryEnabled) state.method = 'delivery';
      $('shopName').textContent = state.shop.name || 'Магазин';
      document.title = state.shop.name || 'Магазин';
      renderBanners(); renderChips(); renderCatalog(); renderBottom();
      if (state.view === 'cart') renderCart();
      $('walletChip').hidden = !state.shop.wallet;
      if (state.shop.wallet) {
        loadMe();
        if (START === 'wallet' && !state.startDone) { state.startDone = true; go('wallet'); }
      } else if (state.view === 'wallet') go('catalog');
    } catch (e) {
      $('catalogView').innerHTML = '<div class="empty"><b>😕</b>Не удалось загрузить магазин.<br>Проверьте интернет и попробуйте ещё раз.<br><br>' +
        '<button class="chip on" id="retry">Повторить</button></div>';
      $('retry').onclick = () => { showSkeleton(); loadCatalog(); };
    }
  }

  function loadCart() {
    try { return JSON.parse(localStorage.getItem(CART_KEY) || '{}') || {}; } catch (e) { return {}; }
  }
  function saveCart() {
    try { localStorage.setItem(CART_KEY, JSON.stringify(state.cart)); } catch (e) {}
  }

  async function api(payload) {
    const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
    return res.json();
  }

  async function loadMe() {
    try {
      if (DEMO) {
        if (state.balance == null) state.balance = Number(PARAMS.get('demobalance')) || 0;
      } else if (inTelegram) {
        const me = await api({ action: 'me', initData: tg.initData });
        if (me.ok) { state.balance = me.balance; state.ops = me.ops || []; }
      }
    } catch (e) {}
    renderWalletChip();
    if (state.view === 'cart') renderCart();
    if (state.view === 'wallet') renderWallet();
    renderBottom();
  }

  function renderWalletChip() {
    $('walletSum').textContent = state.balance == null ? '…' : money(state.balance);
  }

  function cartLines() {
    return Object.keys(state.cart).map(id => ({ p: state.byId[id], qty: state.cart[id] })).filter(l => l.p && l.qty > 0);
  }
  function totals() {
    const lines = cartLines();
    const count = lines.reduce((s, l) => s + l.qty, 0);
    const goods = lines.reduce((s, l) => s + l.qty * l.p.price, 0);
    let delivery = 0;
    if (state.method === 'delivery' && state.shop) {
      delivery = state.shop.freeDeliveryFrom > 0 && goods >= state.shop.freeDeliveryFrom ? 0 : state.shop.deliveryPrice;
    }
    return { lines, count, goods, delivery, total: goods + delivery };
  }

  /* ---------- Каталог ---------- */
  function showSkeleton() {
    $('catalogView').innerHTML = '<div class="grid" style="margin-top:8px">' + Array(6).fill('<div class="skeleton"></div>').join('') + '</div>';
  }

  function renderBanners() {
    const parts = [];
    if (DEMO) parts.push('Демо-режим: магазин ещё не подключён к таблице. Заказы никуда не отправляются.');
    if (state.shop && !state.shop.open) parts.push('⏸ Магазин сейчас не принимает заказы. Каталог можно посмотреть.');
    let html = parts.map(t => '<div class="banner">' + esc(t) + '</div>').join('');
    const s = state.shop || {};
    const info = [];
    if (s.orderHours) info.push('🕐 Заказы принимаем: <b>' + esc(s.orderHours.toLowerCase()) + '</b>');
    if (s.deliveryEnabled && s.deliveryTime) info.push('🚚 ' + esc(s.deliveryTime) + (s.freeDeliveryFrom > 0 ? ', бесплатно от ' + money(s.freeDeliveryFrom) : ''));
    if (info.length) html += '<div class="info">' + info.join('<br>') + '</div>';
    $('banners').innerHTML = html;
    const p = state.points[0];
    $('shopSub').textContent = state.points.length === 1 && p ? '📍 ' + (p.address || p.name) : state.points.length > 1 ? '📍 ' + state.points.length + ' ' + plural(state.points.length, 'пункт', 'пункта', 'пунктов') + ' выдачи' : 'Напитки и снеки';
  }

  function categories() {
    const seen = [];
    state.products.forEach(p => { if (seen.indexOf(p.category) < 0) seen.push(p.category); });
    return seen;
  }

  function renderChips() {
    const cats = categories();
    if (cats.indexOf(state.cat) < 0) state.cat = 'all';
    $('chips').innerHTML = ['all'].concat(cats).map(c =>
      '<button class="chip' + (state.cat === c ? ' on' : '') + '" data-cat="' + esc(c) + '">' + esc(c === 'all' ? 'Все' : c) + '</button>').join('');
  }

  function picHtml(p, cls) {
    const ph = p.photo || '';
    if (/^https?:\/\//.test(ph)) {
      return '<div class="' + cls + '"><img src="' + esc(ph) + '" alt="" loading="lazy" onerror="this.parentNode.classList.add(\'noimg\');this.remove()"></div>';
    }
    return '<div class="' + cls + (ph ? '' : ' noimg') + '">' + esc(ph) + '</div>';
  }

  function footHtml(p) {
    if (!p.available) return '<div class="price">' + money(p.price) + '</div><button class="notify' + (state.notified[p.id] ? ' done' : '') + '" data-notify="' + esc(p.id) + '">' + (state.notified[p.id] ? '✓ Ждём' : '🔔 Сообщить') + '</button>';
    const q = state.cart[p.id] || 0;
    const ctrl = q
      ? '<div class="stepper"><button data-act="dec" data-id="' + esc(p.id) + '" aria-label="Меньше">−</button><span>' + q + '</span><button data-act="inc" data-id="' + esc(p.id) + '" aria-label="Больше"' + (atLimit(p) ? ' disabled' : '') + '>+</button></div>'
      : '<button class="add" data-act="inc" data-id="' + esc(p.id) + '" aria-label="В корзину">+</button>';
    return '<div class="price">' + money(p.price) + '</div>' + ctrl;
  }

  function maxQty(p) { return p.stock != null ? Math.min(99, p.stock) : 99; }
  function atLimit(p) { return (state.cart[p.id] || 0) >= maxQty(p); }

  function buildGroups() {
    const map = {}, list = [];
    state.products.forEach(p => {
      const key = p.category + '|' + p.name;
      if (!map[key]) { map[key] = { key: key, category: p.category, name: p.name, items: [] }; list.push(map[key]); }
      map[key].items.push(p);
    });
    list.forEach(g => { g.available = g.items.some(p => p.available); });
    state.groups = list;
  }

  function volumesOf(g) {
    const vs = [];
    g.items.forEach(p => { const v = p.volume || ''; if (vs.indexOf(v) < 0) vs.push(v); });
    return vs;
  }

  function pickVolume(key, vol) {
    const g = state.groups.filter(x => x.key === key)[0];
    if (!g) return;
    const cur = selected(g);
    const same = g.items.filter(p => (p.volume || '') === vol);
    const next = same.filter(p => p.variant === cur.variant && p.available)[0] || same.filter(p => p.available)[0] || same[0];
    if (next) { state.sel[key] = next.id; refreshGroup(key); }
  }

  function groupOf(id) {
    const p = state.byId[id];
    return p && state.groups.filter(g => g.key === p.category + '|' + p.name)[0];
  }

  function selected(g) {
    const cur = state.byId[state.sel[g.key]];
    if (cur && g.items.indexOf(cur) >= 0) return cur;
    const inCart = g.items.filter(p => state.cart[p.id])[0];
    return inCart || g.items.filter(p => p.available)[0] || g.items[0];
  }

  function stockHtml(p) {
    if (!p.available) return '<div class="stock no">' + (p.soon ? '⏳ Скоро в наличии' : 'Нет в наличии') + '</div>';
    if (p.stock == null) return '';
    return '<div class="stock' + (p.stock <= 5 ? ' low' : '') + '">В наличии: ' + p.stock + ' шт.</div>';
  }

  function cardHtml(g) {
    const p = selected(g);
    const photoSrc = p.photo ? p : (g.items.filter(x => x.photo && x.volume === p.volume)[0] || g.items.filter(x => x.photo)[0] || p);
    const pic = picHtml(photoSrc, 'pic').replace(/<\/div>$/, (p.adult ? '<span class="badge adult">18+</span>' : '') + '</div>');
    const vols = volumesOf(g);
    const sameVol = g.items.filter(x => (x.volume || '') === (p.volume || ''));
    const vars = sameVol.length > 1 || p.variant
      ? '<div class="vars">' + sameVol.map(x => '<button class="var' + (x === p ? ' on' : '') + (x.available ? '' : ' out') + '" data-group="' + esc(g.key) + '" data-var="' + esc(x.id) + '">' + esc(x.variant || x.name) + '</button>').join('') + '</div>'
      : '';
    const volRow = vols.length > 1
      ? '<div class="vols">' + vols.map(v => {
          const any = g.items.some(x => (x.volume || '') === v && x.available);
          return '<button class="vol' + (v === (p.volume || '') ? ' on' : '') + (any ? '' : ' out') + '" data-group="' + esc(g.key) + '" data-vol="' + esc(v) + '">' + esc(v || '—') + '</button>';
        }).join('') + '</div>'
      : (p.volume ? '<div class="vols"><span class="vol on">' + esc(p.volume) + '</span></div>' : '');
    return '<div class="card' + (p.available ? '' : ' soldout') + '" data-group="' + esc(g.key) + '" data-card="' + esc(p.id) + '">' +
      pic +
      '<div class="info"><div class="name">' + esc(g.name) + '</div>' + (p.description ? '<div class="desc">' + esc(p.description) + '</div>' : '') +
        (sameVol.length > 1 ? '<div class="desc">' + sameVol.length + ' ' + plural(sameVol.length, 'вкус', 'вкуса', 'вкусов') + ' →</div>' : '') + vars + stockHtml(p) + '</div>' +
      volRow + '<div class="foot">' + footHtml(p) + '</div></div>';
  }

  function refreshGroup(key) {
    const g = state.groups.filter(x => x.key === key)[0];
    if (!g) return;
    document.querySelectorAll('[data-group="' + CSS.escape(key) + '"].card').forEach(el => { el.outerHTML = cardHtml(g); });
  }

  function renderCatalog() {
    if (!state.shop) return;
    const q = state.q;
    let list = state.groups.filter(g => !q || g.items.some(p => (p.name + ' ' + (p.volume || '') + ' ' + (p.variant || '') + ' ' + p.description + ' ' + p.category).toLowerCase().indexOf(q) >= 0));
    if (!q && state.cat !== 'all') list = list.filter(g => g.category === state.cat);
    // товары в наличии — выше
    const sorted = list.filter(g => g.available).concat(list.filter(g => !g.available));
    const suggest = '<div class="suggest"><b>Не нашли, что хотели?</b><span class="note">Напишите, какой напиток или снек добавить — привезём</span><br><button data-suggest>Предложить товар</button></div>';
    if (!sorted.length) {
      $('catalogView').innerHTML = '<div class="empty"><b>🔍</b>' + (q ? 'Ничего не нашлось' : 'Здесь пока пусто') + '</div>' + suggest;
      return;
    }
    let html = '';
    if (!q && state.cat === 'all') {
      categories().forEach(c => {
        const items = sorted.filter(g => g.category === c);
        if (items.length) html += '<div class="section-title">' + esc(c) + '</div><div class="grid">' + items.map(cardHtml).join('') + '</div>';
      });
    } else {
      html = '<div class="grid" style="margin-top:8px">' + sorted.map(cardHtml).join('') + '</div>';
    }
    $('catalogView').innerHTML = html + suggest;
  }

  async function notifyMe(id) {
    if (state.notified[id]) return toast('Уже ждём — сообщим, когда появится');
    if (!DEMO && !inTelegram) return toast('Откройте магазин через бота в Telegram');
    try {
      const res = DEMO ? { ok: true } : await api({ action: 'notify', initData: tg.initData, productId: id });
      if (!res.ok) throw new Error(res.error);
      state.notified[id] = true; haptic('ok');
      toast('Готово! Напишем в чат, когда товар появится');
      const g = groupOf(id); if (g) refreshGroup(g.key);
    } catch (e) { toast(e.message || 'Не получилось, попробуйте ещё раз'); }
  }

  function onQtyClick(e) {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const id = b.dataset.id, p = state.byId[id];
    if (!p || !p.available) return;
    const q = state.cart[id] || 0;
    if (b.dataset.act === 'inc') {
      if (q >= maxQty(p)) return toast(p.stock != null ? 'Больше нет в наличии: осталось ' + p.stock + ' шт.' : 'Не больше 99 шт.');
      state.cart[id] = q + 1;
    }
    else { if (q <= 1) delete state.cart[id]; else state.cart[id] = q - 1; }
    haptic();
    saveCart();
    const g = groupOf(id);
    if (state.view === 'catalog' && g) refreshGroup(g.key);
    if (state.view === 'cart') {
      if (!totals().count) return go('catalog');
      renderCart();
    }
    renderBottom();
  }

  /* ---------- Корзина и оформление ---------- */
  function payOptions(t) {
    const s = state.shop, opts = [];
    const bal = state.balance, enough = bal != null && bal >= t.total;
    if (s.wallet) opts.push({ id: 'balance', ok: enough, title: '💰 С баланса',
      sub: bal == null ? 'Загружаем баланс…' : enough ? 'Доступно ' + money(bal) + ' · спишем сразу' : 'На балансе ' + money(bal) + ', не хватает ' + money(t.total - bal) });
    if (s.payOnReceipt) opts.push({ id: 'receipt', ok: true, title: '💵 При получении', sub: 'Наличными или переводом, когда привезём заказ' });
    if (s.prepayEnabled) opts.push({ id: 'transfer', ok: true, title: '💳 Перевод сейчас', sub: 'Реквизиты появятся после оформления' });
    const cur = opts.filter(o => o.id === state.pay && o.ok)[0];
    if (!cur) {
      const def = opts.filter(o => o.ok && o.id === 'balance')[0] || opts.filter(o => o.ok)[0];
      state.pay = def ? def.id : null;
    }
    return opts;
  }

  function renderCart() {
    const t = totals();
    const s = state.shop;
    const methods = [];
    if (s.deliveryEnabled) methods.push('delivery');
    if (s.pickupEnabled !== false && state.points.length) methods.push('pickup');
    if (methods.indexOf(state.method) < 0) state.method = methods[0] || 'pickup';

    let html = '<div class="section-title">Корзина</div><div class="panel">' + t.lines.map(l =>
      '<div class="row" data-card="' + esc(l.p.id) + '">' + picHtml(l.p, 'thumb') +
      '<div class="grow"><div class="name">' + esc(l.p.name) + (l.p.volume ? ' ' + esc(l.p.volume) : '') + (l.p.variant ? ' · ' + esc(l.p.variant) : '') + '</div><div class="sub">' + money(l.p.price) + ' × ' + l.qty + ' = <b style="color:var(--text)">' + money(l.p.price * l.qty) + '</b></div></div>' +
      '<div class="full"><div class="stepper"><button data-act="dec" data-id="' + esc(l.p.id) + '">−</button><span>' + l.qty + '</span><button data-act="inc" data-id="' + esc(l.p.id) + '"' + (atLimit(l.p) ? ' disabled' : '') + '>+</button></div></div></div>'
    ).join('') + '</div>';

    html += '<div class="panel"><h2>Как получить</h2>';
    if (methods.length > 1) {
      html += '<div class="seg"><button data-method="delivery" class="' + (state.method === 'delivery' ? 'on' : '') + '">Доставка в комнату</button>' +
        '<button data-method="pickup" class="' + (state.method === 'pickup' ? 'on' : '') + '">Самовывоз</button></div>';
    }
    const pointList = () => state.points.map(p => {
      const on = p.name === state.point;
      return '<button class="point' + (on ? ' on' : '') + '" data-point="' + esc(p.name) + '"><span class="dot"></span><span><b>📍 ' + esc(p.address || p.name) + '</b>' +
        (p.address && p.address.toLowerCase().indexOf(p.name.toLowerCase()) < 0 ? '<small>' + esc(p.name) + '</small><br>' : '') +
        (p.hours ? '<small>🕒 ' + esc(p.hours) + '</small>' : '') + '</span></button>';
    }).join('');
    if (state.method === 'pickup') {
      if (!state.points.length) html += '<p class="warn">Сейчас нет открытых пунктов выдачи.</p>';
      html += pointList();
    } else {
      if (state.points.length) html += pointList();
      else html += '<label class="field" id="fAddress"><span>Адрес *</span><input data-f="address" value="' + esc(state.form.address) + '" placeholder="Общежитие, корпус"></label>';
      html += '<label class="field" id="fRoom" style="margin-top:4px"><span>Номер комнаты *</span><input data-f="room" inputmode="numeric" value="' + esc(state.form.room || '') + '" placeholder="Например, 312"></label>';
      if (s.deliveryTime) html += '<p class="note">🕔 ' + esc(s.deliveryTime) + '</p>';
      if (s.freeDeliveryFrom > 0) {
        html += t.delivery
          ? '<div class="hint-free">Добавьте товаров ещё на <b>' + money(s.freeDeliveryFrom - t.goods) + '</b> — и доставка будет бесплатной</div>'
          : '<div class="hint-free">🎉 Доставка бесплатная</div>';
      }
    }
    html += '</div>';

    html += '<div class="panel"><h2>Контакты</h2>' +
      '<label class="field" id="fName"><span>Фамилия и имя *</span><input data-f="name" value="' + esc(state.form.name) + '" placeholder="Иванов Иван" autocomplete="name"></label>' +
      '<label class="field" id="fPhone"><span>Телефон *</span><input data-f="phone" type="tel" value="' + esc(state.form.phone) + '" placeholder="+7 912 345-67-89" autocomplete="tel"></label>' +
      '<label class="field" style="margin:0"><span>Комментарий</span><textarea data-f="comment" rows="2" placeholder="Пожелания к заказу">' + esc(state.form.comment) + '</textarea></label></div>';

    if (t.lines.some(l => l.p.adult)) {
      html += '<div class="panel"><h2>🔞 Энергетики — только 18+</h2><div class="age' + (state.adultOk ? ' on' : '') + '" id="ageBox" role="checkbox" aria-checked="' + state.adultOk + '">' +
        '<span class="box">' + (state.adultOk ? '✓' : '') + '</span><span><b>Мне исполнилось 18 лет</b>' +
        '<small>При получении покажите паспорт или водительские права. Без документа, удостоверяющего личность, энергетики не выдадим.</small></span></div></div>';
    }

    const opts = payOptions(t);
    html += '<div class="panel"><h2>Оплата</h2>' + opts.map(o =>
      '<button class="point' + (state.pay === o.id ? ' on' : '') + (o.ok ? '' : ' disabled') + '" data-pay="' + o.id + '"><span class="dot"></span><span><b>' + o.title + '</b><small>' + esc(o.sub) + '</small></span></button>').join('') +
      (s.wallet ? '<button class="link-btn" data-topup>+ Пополнить баланс</button>' : '') + '</div>';

    html += '<div class="panel"><div class="sum"><span>Товары, ' + t.count + ' шт.</span><span>' + money(t.goods) + '</span></div>';
    if (state.method === 'delivery') html += '<div class="sum"><span>Доставка</span><span>' + (t.delivery ? money(t.delivery) : 'бесплатно') + '</span></div>';
    html += '<div class="sum total"><span>Итого</span><span>' + money(t.total) + '</span></div>';
    if (s.minOrder > 0 && t.goods < s.minOrder) html += '<div class="warn">Минимальная сумма заказа — ' + money(s.minOrder) + '. Добавьте ещё на ' + money(s.minOrder - t.goods) + '.</div>';
    if (state.error) html += '<div class="warn">' + esc(state.error) + '</div>';
    html += '</div>';

    const view = $('cartView');
    view.innerHTML = html;
    view.querySelectorAll('[data-f]').forEach(el => {
      el.oninput = () => { state.form[el.dataset.f] = el.value; el.closest('.field').classList.remove('bad'); };
    });
    view.querySelectorAll('[data-method]').forEach(el => { el.onclick = () => { state.method = el.dataset.method; haptic(); renderCart(); renderBottom(); }; });
    view.querySelectorAll('[data-point]').forEach(el => { el.onclick = () => { state.point = el.dataset.point; haptic(); renderCart(); }; });
    const ageBox = $('ageBox');
    if (ageBox) ageBox.onclick = () => { state.adultOk = !state.adultOk; haptic(); renderCart(); };
    view.querySelectorAll('[data-pay]').forEach(el => {
      el.onclick = () => {
        if (el.classList.contains('disabled')) return toast('Не хватает денег на балансе — пополните его');
        state.pay = el.dataset.pay; haptic(); renderCart(); renderBottom();
      };
    });
    const topBtn = view.querySelector('[data-topup]');
    if (topBtn) topBtn.onclick = () => { state.returnTo = 'cart'; go('wallet'); };
  }

  async function submitOrder() {
    const t = totals();
    const s = state.shop;
    state.error = '';
    let bad = null;
    const words = state.form.name.trim().split(/\s+/).filter(w => w.length > 1);
    const digits = state.form.phone.replace(/\D/g, '');
    if (words.length < 2) bad = 'fName';
    if (!(digits.length === 10 || (digits.length === 11 && /^[78]/.test(digits)))) bad = bad || 'fPhone';
    if (state.method === 'delivery' && !state.points.length && !state.form.address.trim()) bad = bad || 'fAddress';
    if (state.method === 'delivery' && !String(state.form.room || '').trim()) bad = bad || 'fRoom';
    if (bad) {
      const el = $(bad); el.classList.add('bad'); el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.querySelector('input').focus();
      return toast(bad === 'fName' ? 'Укажите фамилию и имя' : bad === 'fPhone' ? 'Проверьте номер телефона' : bad === 'fRoom' ? 'Укажите номер комнаты' : 'Заполните обязательные поля');
    }
    if (state.points.length && !state.point) return toast(state.method === 'pickup' ? 'Выберите пункт выдачи' : 'Выберите адрес доставки');
    if (!state.pay) return toast('Выберите способ оплаты');
    const needAdult = t.lines.some(l => l.p.adult);
    if (needAdult && !state.adultOk) {
      const box = $('ageBox'); box.classList.add('bad'); box.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return toast('Подтвердите, что вам есть 18 лет');
    }
    if (!s.open || (s.minOrder > 0 && t.goods < s.minOrder)) return;

    if (!DEMO && !inTelegram) return toast('Откройте магазин через бота в Telegram');

    state.sending = true; renderBottom();
    try {
      const payload = {
        action: 'order',
        initData: tg ? tg.initData : '',
        items: t.lines.map(l => ({ id: l.p.id, qty: l.qty })),
        pay: state.pay,
        adult: needAdult ? true : undefined,
        expectedTotal: t.total,
        form: {
          method: state.method, point: state.point,
          name: state.form.name.trim(), address: state.form.address.trim(),
          phone: state.form.phone.trim(), comment: state.form.comment.trim(), room: String(state.form.room || '').trim()
        }
      };
      const res = DEMO ? await demoOrder(t, payload.pay) : await api(payload);
      if (!res.ok) throw new Error(res.error || 'Не удалось оформить заказ');
      state.result = res;
      if (res.paidFromBalance) { state.balance = res.balance; renderWalletChip(); }
      state.pay = null; state.adultOk = false;
      state.result.adult = needAdult;
      state.result.autoCancelHours = s.autoCancelHours;
      state.cart = {}; saveCart();
      haptic('ok');
      go('done');
    } catch (e) {
      state.error = e.message && e.message !== 'Failed to fetch' ? e.message : 'Нет связи с магазином. Попробуйте ещё раз.';
      renderCart();
      toast(state.error);
      loadCatalog();
      if (state.shop && state.shop.wallet) loadMe();
    } finally {
      state.sending = false; renderBottom();
    }
  }

  /* ---------- Экран «Заказ оформлен» ---------- */
  function renderDone() {
    const r = state.result;
    if (r.paidFromBalance) {
      $('doneView').innerHTML =
        '<div class="done"><div class="tick">✓</div><h2>Заказ №' + esc(r.orderNo) + ' оплачен!</h2><p>Мы уже начали собирать</p></div>' +
        '<div class="panel" style="margin-top:18px"><div class="sum"><span>Списано с баланса</span><span>' + money(r.total) + '</span></div>' +
        '<div class="sum total"><span>Остаток</span><span>' + money(r.balance) + '</span></div>' +
        '<ol class="steps"><li>Дождитесь сообщения в чате, что заказ готов.</li>' +
        '<li>' + (r.method === 'delivery' ? 'Мы привезём его по адресу: ' : 'Заберите его: ') + '<b>' + esc(r.place) + '</b></li>' +
        (r.adult ? '<li>🔞 Приготовьте паспорт или водительские права — в заказе энергетики.</li>' : '') + '</ol></div>';
      return;
    }
    if (r.payOnReceipt) {
      $('doneView').innerHTML =
        '<div class="done"><div class="tick">✓</div><h2>Заказ №' + esc(r.orderNo) + ' принят!</h2><p>Мы соберём его и напишем, когда он будет в пути</p></div>' +
        '<div class="panel" style="margin-top:18px"><div class="note">К оплате при получении</div><div class="pay-amount">' + money(r.total) + '</div>' +
        '<div class="note">Наличными или переводом — как удобнее</div>' +
        '<ol class="steps"><li>' + (r.method === 'delivery' ? 'Доставим: ' : 'Заберите: ') + '<b>' + esc(r.place) + '</b></li>' +
        (r.deliveryTime ? '<li>🕔 ' + esc(r.deliveryTime) + '</li>' : '') +
        (r.adult ? '<li>🔞 Приготовьте паспорт или водительские права — в заказе энергетики.</li>' : '') + '</ol></div>' +
        '<p class="note" style="text-align:center;padding:0 24px">Детали заказа мы отправили вам в чат.</p>';
      return;
    }
    $('doneView').innerHTML =
      '<div class="done"><div class="tick">✓</div><h2>Заказ №' + esc(r.orderNo) + ' оформлен!</h2><p>Осталось оплатить — и мы начнём собирать</p></div>' +
      '<div class="panel" style="margin-top:18px"><div class="note">К оплате</div><div class="pay-amount">' + money(r.total) + '</div>' +
      '<div class="note" style="margin-bottom:6px">' + esc(r.payMethod) + '</div>' +
      '<div class="req"><code id="reqText">' + esc(r.requisites) + '</code><button class="copy" id="copyBtn">Копировать</button></div>' +
      '<ol class="steps"><li>Переведите <b>' + money(r.total) + '</b> по реквизитам выше.</li>' +
      '<li>Пришлите скриншот перевода в чат с ботом.</li>' +
      '<li>' + (r.method === 'delivery' ? 'Мы привезём заказ по адресу: ' : 'Заберите заказ, когда придёт уведомление: ') + '<b>' + esc(r.place) + '</b></li>' +
      (r.adult ? '<li>🔞 Приготовьте паспорт или водительские права — в заказе энергетики.</li>' : '') + '</ol>' +
      (r.autoCancelHours > 0 ? '<p class="note">⏳ Если оплата не поступит за ' + esc(r.autoCancelHours) + ' ч, заказ отменится автоматически.</p>' : '') + '</div>' +
      '<p class="note" style="text-align:center;padding:0 24px">Реквизиты и детали заказа мы также отправили вам в чат.</p>';
    $('copyBtn').onclick = () => copy(r.requisites);
  }

  /* ---------- Баланс ---------- */
  function topupBonus(amount) {
    const w = state.shop.wallet;
    return w.bonusPercent > 0 && amount >= w.bonusFrom ? Math.floor(amount * w.bonusPercent / 100) : 0;
  }
  function validTopup(a) {
    const w = state.shop.wallet;
    return a >= w.min && a <= w.max && Math.floor(a) === a;
  }

  function renderWallet() {
    const w = state.shop && state.shop.wallet;
    if (!w) return;
    if (state.topupAmount == null) state.topupAmount = w.presets[Math.min(1, w.presets.length - 1)];
    const a = state.topupAmount;
    const custom = w.presets.indexOf(a) < 0;
    let html = '<div class="bal-card"><small>Ваш баланс</small><div class="big">' + (state.balance == null ? '…' : money(state.balance)) + '</div>' +
      '<small>Оплачивайте заказы в одно нажатие — без переводов каждый раз</small></div>';

    html += '<div class="panel"><h2>Пополнить</h2><div class="amounts">' + w.presets.map(v =>
      '<button class="amt' + (v === a && !custom ? ' on' : '') + '" data-amt="' + v + '">' + money(v) + '</button>').join('') + '</div>' +
      '<label class="field" style="margin:0"><span>Другая сумма, от ' + money(w.min) + ' до ' + money(w.max) + '</span>' +
      '<input id="customAmt" type="number" inputmode="numeric" min="' + w.min + '" max="' + w.max + '" placeholder="Например, 700" value="' + (custom && a ? a : '') + '"></label>';
    if (w.bonusPercent > 0) {
      const b = topupBonus(a);
      html += '<div class="bonus-note">🎁 +' + esc(w.bonusPercent) + '% бонусом при пополнении от ' + money(w.bonusFrom) +
        (b ? ' — зачислим <b>' + money(a + b) + '</b>' : '') + '</div>';
    }
    html += '<ol class="steps"><li>Выберите сумму и нажмите «Пополнить».</li><li>Переведите деньги по реквизитам.</li>' +
      '<li>Пришлите скриншот перевода в чат с ботом — зачислим после проверки.</li></ol>' +
      '<p class="note">Деньги с баланса тратятся только на покупки в нашем магазине. Остаток можно вернуть — напишите нам в чат.</p></div>';

    if (state.ops.length) {
      html += '<div class="panel"><h2>История</h2>' + state.ops.map(o => {
        const d = new Date(o.date);
        const when = isNaN(d) ? '' : d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }) + ', ' + d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        const pending = o.status.indexOf('Ждёт') >= 0, rejected = o.status.indexOf('Отклон') >= 0;
        const cls = rejected ? 'dim' : o.amount > 0 && !pending ? 'plus' : '';
        return '<div class="row"><div class="grow"><div class="name">' + esc(o.type) + (o.basis && o.type !== 'Пополнение' ? ' · ' + esc(o.basis) : '') + '</div>' +
          '<div class="sub">' + esc(when) + (pending || rejected ? ' · ' + esc(o.status) : '') + '</div></div>' +
          '<div class="op-amt ' + cls + '">' + (o.amount > 0 ? '+' : '') + money(o.amount) + '</div></div>';
      }).join('') + '</div>';
    }

    const view = $('walletView');
    view.innerHTML = html;
    view.querySelectorAll('[data-amt]').forEach(el => {
      el.onclick = () => { state.topupAmount = Number(el.dataset.amt); haptic(); renderWallet(); renderBottom(); };
    });
    const inp = $('customAmt');
    inp.oninput = () => {
      const v = Math.floor(Number(inp.value));
      state.topupAmount = v > 0 ? v : 0;
      view.querySelectorAll('[data-amt]').forEach(el => el.classList.remove('on'));
      const note = view.querySelector('.bonus-note');
      if (note && w.bonusPercent > 0) {
        const b = topupBonus(state.topupAmount);
        note.innerHTML = '🎁 +' + esc(w.bonusPercent) + '% бонусом при пополнении от ' + money(w.bonusFrom) + (b ? ' — зачислим <b>' + money(state.topupAmount + b) + '</b>' : '');
      }
      renderBottom();
    };
  }

  async function submitTopup() {
    const a = state.topupAmount;
    if (!validTopup(a)) return toast('Сумма — от ' + money(state.shop.wallet.min) + ' до ' + money(state.shop.wallet.max));
    if (!DEMO && !inTelegram) return toast('Откройте магазин через бота в Telegram');
    state.sending = true; renderBottom();
    try {
      const res = DEMO
        ? await new Promise(ok => setTimeout(() => ok({ ok: true, topupNo: 1, amount: a, bonus: topupBonus(a), payMethod: 'Перевод по номеру карты', requisites: '0000 0000 0000 0000' }), 600))
        : await api({ action: 'topup', initData: tg.initData, amount: a });
      if (!res.ok) throw new Error(res.error || 'Не удалось создать заявку');
      state.topupResult = res;
      haptic('ok');
      go('topup');
      if (!DEMO) loadMe();
    } catch (e) {
      toast(e.message && e.message !== 'Failed to fetch' ? e.message : 'Нет связи с магазином. Попробуйте ещё раз.');
    } finally {
      state.sending = false; renderBottom();
    }
  }

  function renderTopup() {
    const r = state.topupResult;
    $('topupView').innerHTML =
      '<div class="done"><div class="tick" style="background:var(--accent)">₽</div><h2>Заявка №' + esc(r.topupNo) + ' создана</h2><p>Осталось перевести деньги и прислать чек</p></div>' +
      '<div class="panel" style="margin-top:18px"><div class="note">К переводу</div><div class="pay-amount">' + money(r.amount) + '</div>' +
      (r.bonus ? '<div class="bonus-note" style="margin:-4px 0 10px">🎁 На баланс зачислим ' + money(r.amount + r.bonus) + ' вместе с бонусом</div>' : '') +
      '<div class="note" style="margin-bottom:6px">' + esc(r.payMethod) + '</div>' +
      '<div class="req"><code>' + esc(r.requisites) + '</code><button class="copy" id="copyTopup">Копировать</button></div>' +
      '<ol class="steps"><li>Переведите <b>' + money(r.amount) + '</b> по реквизитам выше.</li>' +
      '<li>Пришлите скриншот перевода в чат с ботом.</li>' +
      '<li>Мы проверим и зачислим деньги — придёт уведомление.</li></ol></div>' +
      '<p class="note" style="text-align:center;padding:0 24px">Реквизиты мы также отправили вам в чат.</p>';
    $('copyTopup').onclick = () => copy(r.requisites);
  }

  /* ---------- Пожелания и запросы товаров ---------- */
  function openFeedback(kind) {
    state.fbKind = kind;
    state.returnTo = state.view === 'cart' ? 'cart' : 'catalog';
    go('feedback');
  }

  function renderFeedback() {
    const k = state.fbKind;
    $('feedbackView').innerHTML =
      '<div class="section-title">Написать нам</div><div class="panel">' +
      '<div class="seg"><button data-kind="product" class="' + (k === 'product' ? 'on' : '') + '">Хочу товар</button>' +
      '<button data-kind="wish" class="' + (k === 'wish' ? 'on' : '') + '">Пожелание</button></div>' +
      '<label class="field" style="margin:0"><span>' + (k === 'product' ? 'Какой напиток или снек добавить в каталог?' : 'Отзыв, идея или вопрос администратору') + '</span>' +
      '<textarea id="fbText" rows="5" maxlength="1000" placeholder="' + (k === 'product' ? 'Например: Red Bull 0,25, чипсы Lay’s с крабом' : 'Например: доставляйте ещё и утром') + '">' + esc(state.fbText) + '</textarea></label>' +
      '<p class="note" style="margin-top:8px">Сообщение получит администратор. Ответ придёт в чат с ботом.</p></div>';
    $('feedbackView').querySelectorAll('[data-kind]').forEach(el => { el.onclick = () => { state.fbKind = el.dataset.kind; renderFeedback(); }; });
    const ta = $('fbText');
    ta.oninput = () => { state.fbText = ta.value; renderBottom(); };
  }

  async function submitFeedback() {
    const text = state.fbText.trim();
    if (text.length < 2) return toast('Напишите пару слов 🙂');
    if (!DEMO && !inTelegram) return toast('Откройте магазин через бота в Telegram');
    state.sending = true; renderBottom();
    try {
      const res = DEMO ? { ok: true } : await api({ action: 'feedback', initData: tg.initData, kind: state.fbKind, text: text });
      if (!res.ok) throw new Error(res.error);
      state.fbText = ''; haptic('ok');
      toast('Спасибо! Сообщение отправлено');
      go(state.returnTo === 'cart' && totals().count ? 'cart' : 'catalog');
    } catch (e) {
      toast(e.message && e.message !== 'Failed to fetch' ? e.message : 'Нет связи. Попробуйте ещё раз.');
    } finally { state.sending = false; renderBottom(); }
  }

  function copy(text) {
    const done = () => { toast('Скопировано'); haptic('ok'); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, () => fallback());
    } else fallback();
    function fallback() {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { toast('Не получилось скопировать'); }
      ta.remove();
    }
  }

  /* ---------- Навигация и нижняя кнопка ---------- */
  function go(view) {
    state.view = view;
    state.error = '';
    $('toast').classList.remove('show');
    $('catalogView').hidden = view !== 'catalog';
    $('cartView').hidden = view !== 'cart';
    $('doneView').hidden = view !== 'done';
    $('walletView').hidden = view !== 'wallet';
    $('topupView').hidden = view !== 'topup';
    $('feedbackView').hidden = view !== 'feedback';
    $('catalogTools').hidden = view !== 'catalog';
    $('banners').hidden = view !== 'catalog';
    $('walletChip').style.visibility = view === 'wallet' || view === 'topup' ? 'hidden' : '';
    $('fbBtn').style.visibility = view === 'feedback' ? 'hidden' : '';
    if (view === 'cart') renderCart();
    if (view === 'done') renderDone();
    if (view === 'catalog') renderCatalog();
    if (view === 'wallet') { renderWallet(); loadMe(); }
    if (view === 'topup') renderTopup();
    if (view === 'feedback') renderFeedback();
    const showBack = view === 'cart' || view === 'wallet' || view === 'feedback';
    if (inTelegram) { try { showBack ? tg.BackButton.show() : tg.BackButton.hide(); } catch (e) {} }
    else $('backLink').hidden = !showBack;
    renderBottom();
    window.scrollTo(0, 0);
  }

  function goBack() {
    if (state.view === 'cart') go('catalog');
    else if (state.view === 'wallet' || state.view === 'feedback') go(state.returnTo === 'cart' && totals().count ? 'cart' : 'catalog');
  }

  function renderBottom() {
    const bar = $('bottomBar'), btn = $('mainBtn');
    const t = totals();
    if (state.view === 'catalog') {
      bar.hidden = !t.count;
      btn.className = 'main-btn';
      btn.disabled = false;
      btn.innerHTML = '<span><span class="count">' + t.count + '</span>Корзина</span><span>' + money(t.goods) + '</span>';
    } else if (state.view === 'cart') {
      const s = state.shop || {};
      bar.hidden = false;
      btn.className = 'main-btn';
      btn.disabled = state.sending || !s.open || (s.minOrder > 0 && t.goods < s.minOrder);
      const label = !s.open ? 'Магазин закрыт' : state.pay === 'balance' ? 'Оплатить с баланса' : 'Оформить заказ';
      btn.innerHTML = state.sending ? '<span class="spin" style="margin:auto"></span>' : '<span>' + label + '</span><span>' + money(t.total) + '</span>';
    } else if (state.view === 'feedback') {
      bar.hidden = false;
      btn.className = 'main-btn center';
      btn.disabled = state.sending || state.fbText.trim().length < 2;
      btn.innerHTML = state.sending ? '<span class="spin"></span>' : 'Отправить';
    } else if (state.view === 'wallet') {
      bar.hidden = false;
      btn.className = 'main-btn center';
      btn.disabled = state.sending || !validTopup(state.topupAmount);
      btn.innerHTML = state.sending ? '<span class="spin"></span>' : validTopup(state.topupAmount) ? 'Пополнить на ' + money(state.topupAmount) : 'Введите сумму от ' + money(state.shop.wallet.min);
    } else {
      bar.hidden = false;
      btn.className = 'main-btn center';
      btn.disabled = false;
      btn.textContent = inTelegram ? 'Готово, вернуться в чат' : 'Вернуться в каталог';
    }
  }

  function onMain() {
    if (state.view === 'catalog') return go('cart');
    if (state.view === 'cart') return submitOrder();
    if (state.view === 'wallet') return submitTopup();
    if (state.view === 'feedback') return submitFeedback();
    if (inTelegram) { try { tg.close(); return; } catch (e) {} }
    go('catalog');
  }

  let toastTimer;
  function toast(text) {
    const el = $('toast');
    el.textContent = text; el.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
  }

  /* ---------- Демо-данные (если магазин открыт не через бота) ---------- */
  function demoData() {
    const P = (id, category, name, description, price, photo, available) => ({ id: String(id), category, name, description, price, photo, available: available !== false });
    return {
      ok: true,
      shop: { autoCancelHours: 3, name: 'Студенческий перекус', open: true, minOrder: 0, deliveryEnabled: true, deliveryInfo: 'Доставим прямо в вашу комнату', deliveryPrice: 99, freeDeliveryFrom: 500,
        payOnReceipt: true, prepayEnabled: false, pickupEnabled: true, deliveryTime: 'Доставка ежедневно с 18:00 до 22:00', orderHours: 'Круглосуточно',
        wallet: { min: 300, max: 5000, presets: [300, 500, 1000], bonusPercent: 0, bonusFrom: 1000 } },
      points: [{ name: 'Колмогорова', address: 'ул. Колмогорова, 64', hours: '' }],
      products: [
        P(1, 'Напитки', 'Кола', '0,5 л, охлаждённая', 90, '🥤'),
        Object.assign(P(2, 'Энергетики', 'Gorilla 0,45 л', 'Энергетический напиток', 100, '⚡️'), { adult: true, stock: 4, variant: 'Original' }),
        Object.assign(P(21, 'Энергетики', 'Gorilla 0,45 л', 'Энергетический напиток', 100, '🥭'), { adult: true, stock: 12, variant: 'Манго-кокос' }),
        Object.assign(P(22, 'Энергетики', 'Gorilla 0,45 л', 'Энергетический напиток', 100, '🍉', false), { adult: true, stock: 0, soon: true, variant: 'Арбуз' }),
        P(3, 'Напитки', 'Холодный чай с лимоном', '0,5 л', 85, '🧋'),
        P(4, 'Напитки', 'Вода негазированная', '0,5 л', 45, '💧'),
        P(5, 'Напитки', 'Кофе в банке', 'Латте, 0,25 л', 110, '☕️'),
        P(6, 'Чипсы и снеки', 'Чипсы «Сметана и зелень»', '90 г', 95, '🥔'),
        P(7, 'Чипсы и снеки', 'Сухарики с беконом', '60 г', 55, '🍞'),
        P(8, 'Чипсы и снеки', 'Солёный арахис', '100 г', 70, '🥜'),
        Object.assign(P(9, 'Чипсы и снеки', 'Попкорн карамельный', '80 г', 80, '🍿', false), { stock: 0 }),
        P(10, 'Сладкое', 'Шоколадный батончик', '50 г', 65, '🍫'),
        P(11, 'Сладкое', 'Печенье с шоколадом', '120 г', 75, '🍪'),
        P(12, 'Сладкое', 'Мармеладные мишки', '70 г', 60, '🐻'),
        P(13, 'Перекус', 'Лапша быстрого приготовления', 'Курица, 90 г', 55, '🍜'),
        P(14, 'Перекус', 'Сэндвич с ветчиной и сыром', 'Свежий каждый день', 150, '🥪', false)
      ]
    };
  }
  function demoOrder(t, pay) {
    if (pay === 'balance') {
      return new Promise(res => setTimeout(() => res({ ok: true, orderNo: 1, total: t.total, paidFromBalance: true,
        balance: state.balance - t.total, method: state.method, place: 'ул. Колмогорова, 64' + (state.method === 'delivery' ? ', комн. ' + state.form.room : '') }), 600));
    }
    const place = 'ул. Колмогорова, 64' + (state.method === 'delivery' ? ', комн. ' + state.form.room : '');
    return new Promise(res => setTimeout(() => res({
      ok: true, orderNo: 1, total: t.total, payMethod: 'Перевод по номеру карты', requisites: '0000 0000 0000 0000',
      method: state.method, place: place, payOnReceipt: pay === 'receipt', deliveryTime: state.shop.deliveryTime
    }), 700));
  }
})();
</script>
</body>
</html>
